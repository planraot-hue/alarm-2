<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ออฟไลน์อยู่ — My Planner</title>
    <style>
      /* หน้านี้ต้องยืนได้ด้วยตัวเอง ห้ามพึ่ง CSS หรือฟอนต์จากเน็ต */
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #fff9f2;
        color: #4a4038;
        font-family: 'Mali', 'Comic Sans MS', system-ui, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        background: #fff;
        border-radius: 2rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 10px 30px rgba(74, 64, 56, 0.12);
      }
      h1 {
        margin: 0.5rem 0;
        font-size: 1.5rem;
      }
      p {
        margin: 0.4rem 0;
        color: #8a7f74;
        font-size: 0.95rem;
      }
      button {
        margin-top: 1.25rem;
        padding: 0.7rem 1.6rem;
        border: 0;
        border-radius: 999px;
        background: #ffc2d1;
        color: #c25a7c;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 3px 0 rgba(74, 64, 56, 0.12);
      }
      button:active {
        transform: scale(0.96);
      }
      .emoji {
        font-size: 3.5rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">🌧️</div>
      <h1>ตอนนี้ออฟไลน์อยู่</h1>
      <p>My Planner ต้องต่ออินเทอร์เน็ตเพื่อดึงนัดหมายจากเซิร์ฟเวอร์</p>
      <p>เช็คสัญญาณแล้วลองใหม่อีกครั้งนะ</p>
      <button onclick="location.reload()">ลองใหม่ 🔄</button>
    </div>
  </body>
</html>
